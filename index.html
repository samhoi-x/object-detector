<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI 物件識別</title>
<style>
  :root {
    --fg: #fff;
    --muted: #c7c7cc;
    --accent: #0a84ff;
    --manual: #30d158;
    --danger: #ff453a;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
            "Microsoft JhengHei", "Noto Sans TC", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: #000;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage { position: fixed; inset: 0; background: #000; overflow: hidden; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #photoCanvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; touch-action: none; cursor: crosshair; }

  .placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: var(--muted); z-index: 2;
  }
  .placeholder .icon { font-size: 52px; }
  .placeholder p { font-size: 15px; }

  .mode-tag {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 14px;
    font-size: 12px; color: #fff; background: rgba(10,132,255,0.9);
    padding: 4px 10px; border-radius: 10px; z-index: 3;
  }
  .ai-box {
    position: absolute; top: calc(56px + env(safe-area-inset-top));
    left: 14px; right: 14px; z-index: 4;
    background: rgba(20,20,22,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 12px 14px;
    max-height: 45dvh; overflow-y: auto;
  }
  .ai-box .ai-head { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .ai-line { font-size: 14px; line-height: 1.6; padding: 2px 0; }
  .ai-line:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.06); }

  .hint {
    position: absolute; bottom: calc(122px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #fff; background: rgba(0,0,0,0.6);
    padding: 5px 13px; border-radius: 10px; z-index: 4; white-space: nowrap;
  }
  .status {
    position: absolute; bottom: calc(92px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted); z-index: 4;
    text-align: center; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status.err { color: var(--danger); }

  .bottombar {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center;
    gap: 26px; z-index: 6;
    background: linear-gradient(to top, rgba(0,0,0,0.45), transparent);
  }
  .side-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #fff; border: none; cursor: pointer;
    font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.05s ease, opacity 0.15s ease;
  }
  .side-btn:active { transform: scale(0.9); }
  .side-btn:disabled { opacity: 0.35; }
  #capture {
    width: 74px; height: 74px; border-radius: 50%;
    background: #fff; border: 4px solid rgba(255,255,255,0.35);
    box-shadow: 0 3px 16px rgba(0,0,0,0.5);
    cursor: pointer; font-size: 28px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.05s ease;
    padding: 0;
  }
  #capture:active { transform: scale(0.92); }
  #capture:disabled { opacity: 0.35; }
  #capture.off { background: var(--accent); border-color: rgba(10,132,255,0.4); }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="photoCanvas" hidden></canvas>

  <div class="placeholder" id="placeholder">
    <div class="icon">📷</div>
    <p>未開啟鏡頭</p>
  </div>

  <div class="mode-tag" id="modeTag" hidden></div>
  <div class="ai-box" id="aiBox" hidden></div>
  <div class="hint" id="hint" hidden>🖐️ 拖動框住物件（可畫多個），撳 🤖 精準識別</div>
  <div class="status" id="status"></div>

  <div class="bottombar">
    <button class="side-btn" id="clearBox" hidden aria-label="清除框">🗑</button>
    <button id="capture" aria-label="開鏡頭">▶️</button>
    <button class="side-btn" id="ai" disabled aria-label="AI 識別">🤖</button>
  </div>
</div>

<script>
const video = document.getElementById('video');
const photoCanvas = document.getElementById('photoCanvas');
const pctx = photoCanvas.getContext('2d');
const stage = document.getElementById('stage');
const placeholder = document.getElementById('placeholder');
const statusEl = document.getElementById('status');
const captureBtn = document.getElementById('capture');
const modeTag = document.getElementById('modeTag');
const hint = document.getElementById('hint');
const aiBtn = document.getElementById('ai');
const aiBox = document.getElementById('aiBox');
const clearBoxBtn = document.getElementById('clearBox');

const AI_API_URL = 'https://object-detector-api.vercel.app/api/vision';

const frameCanvas = document.createElement('canvas');
const fctx = frameCanvas.getContext('2d');

let stream = null;
let running = false;
let frozen = false;
let boxes = [];
let boxLabels = [];

function photoTransform() {
  const rect = photoCanvas.getBoundingClientRect();
  const vw = photoCanvas.width, vh = photoCanvas.height;
  if (!vw || !vh) return null;
  const scale = Math.min(rect.width / vw, rect.height / vh);
  const dx = (rect.width - vw * scale) / 2;
  const dy = (rect.height - vh * scale) / 2;
  return { rect, scale, dx, dy };
}
function clientToPhoto(cx, cy) {
  const t = photoTransform();
  if (!t) return null;
  return { x: (cx - t.rect.left - t.dx) / t.scale, y: (cy - t.rect.top - t.dy) / t.scale };
}

function drawUserBox(b, i) {
  const hasLabel = boxLabels && boxLabels[i];
  const color = hasLabel ? '#30d158' : '#ffd60a';
  pctx.strokeStyle = color;
  pctx.lineWidth = 3;
  pctx.strokeRect(b.x, b.y, b.w, b.h);
  const label = (i + 1) + (hasLabel ? ' ' + boxLabels[i] : '');
  pctx.font = 'bold 14px -apple-system, "PingFang TC", sans-serif';
  const tw = pctx.measureText(label).width + 12;
  const ty = b.y - 22;
  pctx.fillStyle = color;
  pctx.fillRect(b.x, ty > 0 ? ty : b.y, tw, 22);
  pctx.fillStyle = '#000';
  pctx.fillText(label, b.x + 6, (ty > 0 ? ty : b.y) + 15);
}

function redrawPhoto(dragBox) {
  if (!photoCanvas.width) return;
  pctx.clearRect(0, 0, photoCanvas.width, photoCanvas.height);
  pctx.drawImage(frameCanvas, 0, 0);
  for (let i = 0; i < boxes.length; i++) drawUserBox(boxes[i], i);
  if (dragBox) {
    pctx.strokeStyle = '#ffd60a';
    pctx.lineWidth = 2.5;
    pctx.setLineDash([7, 5]);
    pctx.strokeRect(dragBox.x, dragBox.y, dragBox.w, dragBox.h);
    pctx.setLineDash([]);
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function showAiResult(text) {
  if (!text) { aiBox.hidden = true; return; }
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  aiBox.innerHTML = '<div class="ai-head">🤖 AI 識別</div>' +
    lines.map(l => '<div class="ai-line">' + escapeHtml(l) + '</div>').join('');
  aiBox.hidden = false;
}

async function aiDetect() {
  if (!frozen || !frameCanvas.width) return;
  if (boxes.length === 0) {
    statusEl.textContent = '請先拖動框住想識別嘅物件';
    statusEl.className = 'status';
    return;
  }
  aiBtn.disabled = true;

  {
    statusEl.textContent = 'AI 識別 ' + boxes.length + ' 個框…';
    statusEl.className = 'status';
    const PROMPT = '呢件物件係乜？用繁體中文粵語，最多10個字，直接答物件名，唔要解釋。';
    const crops = boxes.map(b => {
      const tmp = document.createElement('canvas');
      tmp.width = Math.max(1, Math.round(b.w));
      tmp.height = Math.max(1, Math.round(b.h));
      const tctx = tmp.getContext('2d');
      tctx.drawImage(frameCanvas, b.x, b.y, b.w, b.h, 0, 0, tmp.width, tmp.height);
      return tmp.toDataURL('image/jpeg', 0.9);
    });
    const results = await Promise.all(crops.map(async img => {
      try {
        const resp = await fetch(AI_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: img, prompt: PROMPT })
        });
        const data = await resp.json();
        if (data.error) return '認唔到';
        const t = (data.result || '').split('\n')[0].trim();
        return t || '認唔到';
      } catch (e) { return '認唔到'; }
    }));
    boxLabels = results;
    showAiResult(results.map((r, i) => (i + 1) + '. ' + r).join('\n'));
    statusEl.textContent = 'AI 識別完成 ✓';
    redrawPhoto();
  }
  aiBtn.disabled = false;
}

async function capturePhoto() {
  if (!stream || frozen) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;

  frozen = true;

  const sw = stage.clientWidth, sh = stage.clientHeight;
  const coverScale = Math.max(sw / vw, sh / vh);
  const cw = sw / coverScale;
  const ch = sh / coverScale;
  const cx = (vw - cw) / 2;
  const cy = (vh - ch) / 2;

  frameCanvas.width = Math.round(cw);
  frameCanvas.height = Math.round(ch);
  fctx.drawImage(video, cx, cy, cw, ch, 0, 0, frameCanvas.width, frameCanvas.height);

  photoCanvas.width = frameCanvas.width;
  photoCanvas.height = frameCanvas.height;

  video.style.display = 'none';
  photoCanvas.hidden = false;
  modeTag.hidden = false;
  modeTag.textContent = '📸 相片模式';
  captureBtn.textContent = '↩️';
  captureBtn.classList.add('off');
  aiBtn.disabled = false;
  hint.hidden = true;
  aiBox.hidden = true;

  boxes = [];
  boxLabels = [];
  clearBoxBtn.hidden = false;
  redrawPhoto();
  statusEl.textContent = '拖動框住想識別嘅物件，撳 🤖';
  statusEl.className = 'status';
  hint.hidden = false;
}

let dragStart = null;
let dragCur = null;

photoCanvas.addEventListener('pointerdown', (e) => {
  if (!frozen) return;
  const pt = clientToPhoto(e.clientX, e.clientY);
  if (!pt) return;
  dragStart = pt;
  dragCur = pt;
  photoCanvas.setPointerCapture(e.pointerId);
  e.preventDefault();
});

photoCanvas.addEventListener('pointermove', (e) => {
  if (!frozen || !dragStart) return;
  const pt = clientToPhoto(e.clientX, e.clientY);
  if (!pt) return;
  dragCur = pt;
  redrawPhoto({
    x: Math.min(dragStart.x, pt.x),
    y: Math.min(dragStart.y, pt.y),
    w: Math.abs(pt.x - dragStart.x),
    h: Math.abs(pt.y - dragStart.y)
  });
  e.preventDefault();
});

photoCanvas.addEventListener('pointerup', finishDrag);
photoCanvas.addEventListener('pointercancel', finishDrag);
photoCanvas.addEventListener('lostpointercapture', finishDrag);

function finishDrag() {
  if (!frozen || !dragStart) return;
  const x = Math.min(dragStart.x, dragCur.x);
  const y = Math.min(dragStart.y, dragCur.y);
  const w = Math.abs(dragCur.x - dragStart.x);
  const h = Math.abs(dragCur.y - dragStart.y);
  dragStart = null;
  dragCur = null;

  if (w < 20 || h < 20) { redrawPhoto(); return; }

  boxes.push({ x, y, w, h });
  statusEl.textContent = '已加框 #' + boxes.length + '（可繼續畫，撳 🤖 識別）';
  statusEl.className = 'status';
  redrawPhoto();
}

function clearBoxes() {
  boxes = [];
  boxLabels = [];
  aiBox.hidden = true;
  redrawPhoto();
  statusEl.textContent = '已清除所有框';
  statusEl.className = 'status';
}

function resumeLive() {
  frozen = false;
  boxes = [];
  boxLabels = [];
  photoCanvas.hidden = true;
  pctx.clearRect(0, 0, photoCanvas.width, photoCanvas.height);
  video.style.display = '';
  modeTag.hidden = true;
  hint.hidden = true;
  clearBoxBtn.hidden = true;
  aiBox.hidden = true;
  captureBtn.textContent = '📷';
  captureBtn.classList.remove('off');
  aiBtn.disabled = true;
  statusEl.textContent = '';
  statusEl.className = 'status';
}

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    placeholder.style.display = 'none';
    running = true;
    frozen = false;
    captureBtn.textContent = '📷';
    captureBtn.disabled = false;
    statusEl.textContent = '影相後框住物件，撳 🤖 識別';
    statusEl.className = 'status';
  } catch (err) {
    console.error(err);
    running = false;
    statusEl.textContent = err.name === 'NotAllowedError'
      ? '鏡頭權限被拒絕，請喺瀏覽器允許鏡頭存取。'
      : '無法開啟鏡頭：' + err.message;
    statusEl.className = 'status err';
    captureBtn.textContent = '▶️';
  }
}

function stop() {
  running = false;
  frozen = false;
  boxes = [];
  boxLabels = [];
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  photoCanvas.hidden = true;
  pctx.clearRect(0, 0, photoCanvas.width, photoCanvas.height);
  video.style.display = '';
  modeTag.hidden = true;
  hint.hidden = true;
  clearBoxBtn.hidden = true;
  aiBox.hidden = true;
  placeholder.style.display = '';
  captureBtn.textContent = '▶️';
  captureBtn.classList.remove('off');
  captureBtn.disabled = false;
  aiBtn.disabled = true;
  statusEl.textContent = '';
  statusEl.className = 'status';
}

captureBtn.addEventListener('click', () => {
  if (!running) start();
  else if (frozen) resumeLive();
  else capturePhoto();
});
aiBtn.addEventListener('click', aiDetect);
clearBoxBtn.addEventListener('click', clearBoxes);
</script>
</body>
</html>
