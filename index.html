<!doctype html>
<html lang="zh-Hant">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>物件偵測</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>

<style>
  :root {
    --fg: #fff;
    --muted: #c7c7cc;
    --accent: #0a84ff;
    --manual: #30d158;
    --danger: #ff453a;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
            "Microsoft JhengHei", "Noto Sans TC", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: #000;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== 全屏相機容器 ===== */
  #stage {
    position: fixed; inset: 0;
    background: #000;
    overflow: hidden;
  }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  canvas#canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #photoCanvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; touch-action: none; cursor: crosshair; }

  /* ===== 未開鏡頭提示 ===== */
  .placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: var(--muted); z-index: 2;
  }
  .placeholder .icon { font-size: 52px; }
  .placeholder p { font-size: 15px; }

  /* ===== 頂部標籤 ===== */
  .mode-tag {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 14px;
    font-size: 12px; color: #fff; background: rgba(10,132,255,0.9);
    padding: 4px 10px; border-radius: 10px; z-index: 3;
  }
  .fps {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 14px;
    font-size: 11px; color: #fff; background: rgba(0,0,0,0.5);
    padding: 4px 8px; border-radius: 8px; z-index: 3; font-variant-numeric: tabular-nums;
  }

  /* ===== 分類結果卡片（浮動頂部）===== */
  .classify {
    position: absolute; top: calc(56px + env(safe-area-inset-top));
    left: 14px; right: 14px; z-index: 4;
    background: rgba(20,20,22,0.82);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 12px 14px;
    max-height: 130px; overflow-y: auto;
  }
  .classify .cls-head { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .classify .cls-main { font-size: 18px; font-weight: 700; }
  .classify .cls-main .cls-en { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .classify .cls-conf { font-size: 14px; color: var(--accent); font-weight: 700; }
  .classify .cls-alt { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* ===== 偵測結果 chips（浮動底部，橫向 scroll）===== */
  .chips {
    position: absolute; left: 14px; right: 14px;
    bottom: calc(148px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; overflow-x: auto;
    z-index: 4; pointer-events: none;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #fff; border-radius: 20px; padding: 6px 13px;
    font-size: 14px; white-space: nowrap;
  }
  .chip b { color: var(--accent); font-weight: 700; }
  .chip.manual { border: 1px solid rgba(48,209,88,0.6); }
  .chip.manual b { color: var(--manual); }
  .chip.empty { color: var(--muted); font-style: italic; }

  /* ===== 提示 ===== */
  .hint {
    position: absolute; bottom: calc(122px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #fff; background: rgba(0,0,0,0.6);
    padding: 5px 13px; border-radius: 10px; z-index: 4; white-space: nowrap;
  }

  /* ===== 狀態文字 ===== */
  .status {
    position: absolute; bottom: calc(92px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted); z-index: 4;
    text-align: center; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status.err { color: var(--danger); }

  /* ===== 底部工具列 ===== */
  .bottombar {
    position: absolute; left: 0; right: 0;
    bottom: 0;
    padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center;
    gap: 26px; z-index: 6;
    background: linear-gradient(to top, rgba(0,0,0,0.45), transparent);
  }
  .side-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #fff; border: none; cursor: pointer;
    font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.05s ease, opacity 0.15s ease;
  }
  .side-btn:active { transform: scale(0.9); }
  .side-btn:disabled { opacity: 0.35; }
  #capture {
    width: 74px; height: 74px; border-radius: 50%;
    background: #fff; border: 4px solid rgba(255,255,255,0.35);
    box-shadow: 0 3px 16px rgba(0,0,0,0.5);
    cursor: pointer; font-size: 28px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.05s ease;
    padding: 0;
  }
  #capture:active { transform: scale(0.92); }
  #capture:disabled { opacity: 0.35; }
  #capture.off { background: var(--accent); border-color: rgba(10,132,255,0.4); }

  @media (min-width: 820px) {
    /* 桌面版：相機畫面居中，唔會太闊 */
    #stage { inset: 0; }
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <canvas id="photoCanvas" hidden></canvas>

  <div class="placeholder" id="placeholder">
    <div class="icon">📷</div>
    <p>未開啟鏡頭</p>
  </div>

  <div class="mode-tag" id="modeTag" hidden></div>
  <div class="fps" id="fps" hidden></div>
  <div class="classify" id="classifyBox" hidden></div>
  <div class="chips" id="chips"></div>
  <div class="hint" id="hint" hidden>🖐️ 拖動框選漏咗嘅物件，鬆手自動分析</div>
  <div class="status" id="status"></div>

  <div class="bottombar">
    <button class="side-btn" id="advanced" disabled aria-label="進階偵測">🔍</button>
    <button id="capture" disabled aria-label="影相">📷</button>
    <button class="side-btn" id="toggle" aria-label="開關鏡頭">▶️</button>

</div>

<script>
// ---- 中文名稱對照（COCO-SSD 80 類）----

  'skis':'滑雪板', 'snowboard':'單板滑雪', 'sports ball':'波', 'kite':'風箏', 'baseball bat':'棒球棍',
  'baseball glove':'棒球手套', 'skateboard':'滑板', 'surfboard':'衝浪板', 'tennis racket':'網球拍',
  'bottle':'樽', 'wine glass':'酒杯', 'cup':'杯', 'fork':'叉', 'knife':'刀', 'spoon':'匙羹',
  'bowl':'碗', 'banana':'香蕉', 'apple':'蘋果', 'sandwich':'三文治', 'orange':'橙',
  'broccoli':'西蘭花', 'carrot':'紅蘿蔔', 'hot dog':'熱狗', 'pizza':'薄餅', 'donut':'冬甩',
  'cake':'蛋糕', 'chair':'凳', 'couch':'梳化', 'potted plant':'盆栽', 'bed':'床',
  'dining table':'餐枱', 'toilet':'馬桶', 'tv':'電視', 'laptop':'手提電腦', 'mouse':'滑鼠',
  'remote':'遙控器', 'keyboard':'鍵盤', 'cell phone':'手機', 'microwave':'微波爐', 'oven':'焗爐',
  'toaster':'多士爐', 'sink':'洗手盆', 'refrigerator':'雪櫃', 'book':'書', 'clock':'鐘',
  'vase':'花瓶', 'scissors':'較剪', 'teddy bear':'啤啤熊', 'hair drier':'風筒', 'toothbrush':'牙刷'

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const photoCanvas = document.getElementById('photoCanvas');
const pctx = photoCanvas.getContext('2d');
const stage = document.getElementById('stage');
const placeholder = document.getElementById('placeholder');
const chipsEl = document.getElementById('chips');
const statusEl = document.getElementById('status');
const toggleBtn = document.getElementById('toggle');
const captureBtn = document.getElementById('capture');
const fpsEl = document.getElementById('fps');
const modeTag = document.getElementById('modeTag');
const hint = document.getElementById('hint');
const advancedBtn = document.getElementById('advanced');
const classifyBox = document.getElementById('classifyBox');

const frameCanvas = document.createElement('canvas');
const fctx = frameCanvas.getContext('2d');

let model = null;
let modelPromise = null;
let stream = null;
let running = false;
let frozen = false;
let rafId = null;
let lastFrame = 0;
let fpsAccum = [];
let photoPredictions = [];
let owlDetector = null;
let owlLoading = false;
let mobileModel = null;
let mobilePromise = null;

function zh(label) { return ZH[label] || label; }

// ---- 開放詞彙偵測（OWL-ViT）家居物品標籤 ----
const HOME_LABELS = [
  'laundry basket','trash can','mug','cup','water bottle','plate','bowl',
  'fork','spoon','knife','chopsticks','chair','table','sofa','bed','pillow',
  'towel','clothes','shoes','slippers','socks','backpack','handbag','wallet',
  'keys','umbrella','laptop','phone','keyboard','mouse','television','remote control',
  'book','pen','scissors','glasses','watch','plant','lamp','mirror','clock',
  'toothbrush','hair dryer','bottle','pot','pan','person','dog','cat'
];
const HOME_ZH = {
  'laundry basket':'洗衣籃','trash can':'垃圾桶','mug':'馬克杯','cup':'杯',
  'water bottle':'水樽','plate':'碟','bowl':'碗','fork':'叉','spoon':'匙羹',
  'knife':'刀','chopsticks':'筷子','chair':'凳','table':'枱','sofa':'梳化',
  'bed':'床','pillow':'枕頭','towel':'毛巾','clothes':'衫','shoes':'鞋',
  'slippers':'拖鞋','socks':'襪','backpack':'背囊','handbag':'手袋','wallet':'銀包',
  'keys':'鎖匙','umbrella':'遮','laptop':'手提電腦','phone':'手機','keyboard':'鍵盤',
  'mouse':'滑鼠','television':'電視','remote control':'遙控器','book':'書','pen':'筆',
  'scissors':'較剪','glasses':'眼鏡','watch':'手錶','plant':'盆栽','lamp':'燈',
  'mirror':'鏡','clock':'鐘','toothbrush':'牙刷','hair dryer':'風筒','bottle':'樽',
  'pot':'煲','pan':'平底鑊','person':'人','dog':'狗','cat':'貓'
};

async function loadModel() {
  if (model) return model;
  if (modelPromise) return modelPromise;
  statusEl.textContent = '載入模型中…';
  statusEl.className = 'status';
  modelPromise = cocoSsd.load({ base: 'mobilenet_v2' });
  model = await modelPromise;
  return model;
}

// ---- ImageNet 中文對照 ----
const IMAGENET_ZH = [
  ['hamper','洗衣籃'], ['laundry','洗衣'], ['washbasin','洗手盆'], ['hand basin','洗手盆'],
  ['trash','垃圾桶'], ['garbage','垃圾桶'], ['dustbin','垃圾桶'], ['ashbin','垃圾桶'],
  ['coffee mug','咖啡杯'], ['mug','馬克杯'], ['water bottle','水樽'], ['soda bottle','汽水樽'],
  ['beer bottle','啤酒樽'], ['wine bottle','紅酒樽'], ['plate','碟'], ['bowl','碗'],
  ['fork','叉'], ['spoon','匙羹'], ['knife','刀'], ['frying pan','平底鑊'], ['skillet','平底鑊'],
  ['cooking pot','煲'], ['saucepan','煲'], ['chair','凳'], ['table','枱'], ['desk','書枱'],
  ['sofa','梳化'], ['couch','梳化'], ['bed','床'], ['pillow','枕頭'], ['towel','毛巾'],
  ['backpack','背囊'], ['handbag','手袋'], ['purse','銀包'], ['wallet','銀包'], ['billfold','銀包'],
  ['keyboard','鍵盤'], ['mouse','滑鼠'], ['laptop','手提電腦'], ['desktop computer','桌上電腦'],
  ['monitor','顯示器'], ['television','電視'], ['remote','遙控器'], ['book','書'],
  ['pen','筆'], ['pencil','鉛筆'], ['scissors','較剪'], ['sunglasses','太陽眼鏡'],
  ['glasses','眼鏡'], ['watch','手錶'], ['clock','鐘'], ['vase','花瓶'], ['toothbrush','牙刷'],
  ['hair dryer','風筒'], ['blow dryer','風筒'], ['hair drier','風筒'], ['bottle','樽'],
  ['banana','香蕉'], ['apple','蘋果'], ['orange','橙'], ['dog','狗'], ['cat','貓'],
  ['bird','雀仔'], ['cellphone','手機'], ['cell phone','手機'], ['mobile phone','手機'],
  ['handset','手機'], ['shoe','鞋'], ['slipper','拖鞋'], ['sock','襪'], ['umbrella','遮'],
  ['plant','植物'], ['flower','花'], ['lamp','燈'], ['mirror','鏡'], ['chopsticks','筷子'],
  ['shopping basket','購物籃'], ['shopping cart','購物車'], ['person','人'], ['teapot','茶壺'],
  ['refrigerator','雪櫃'], ['dishwasher','洗碗機'], ['washing machine','洗衣機']
];
function imagenetZh(className) {
  const lower = className.toLowerCase();
  for (const [key, zh] of IMAGENET_ZH) {
    if (lower.includes(key)) return zh;
  }
  return className;
}

async function loadMobile() {
  if (mobileModel) return mobileModel;
  if (mobilePromise) return mobilePromise;
  mobilePromise = mobilenet.load({ version: 2, alpha: 1.0 }).then(m => { mobileModel = m; return m; });
  return mobilePromise;
}

function showClassify(scope, preds) {
  if (!preds || preds.length === 0) { classifyBox.hidden = true; return; }
  const top = preds[0];
  const zhName = imagenetZh(top.className);
  const alt = preds.slice(1, 3).map(p => imagenetZh(p.className) + ' ' + Math.round(p.probability * 100) + '%').join(' · ');
  classifyBox.innerHTML = '<div class="cls-head">🔍 ' + scope + '分類</div>' +
    '<div class="cls-main">' + zhName + '<span class="cls-en">' + top.className + '</span></div>' +
    '<div class="cls-conf">' + Math.round(top.probability * 100) + '%</div>' +
    (alt ? '<div class="cls-alt">其他可能：' + alt + '</div>' : '');
  classifyBox.hidden = false;
}

function setSize() {
  canvas.width = stage.clientWidth;
  canvas.height = stage.clientHeight;
}

function photoTransform() {
  const rect = photoCanvas.getBoundingClientRect();
  const vw = photoCanvas.width, vh = photoCanvas.height;
  if (!vw || !vh) return null;
  const scale = Math.min(rect.width / vw, rect.height / vh);
  const dx = (rect.width - vw * scale) / 2;
  const dy = (rect.height - vh * scale) / 2;
  return { rect, scale, dx, dy };
}
function clientToPhoto(cx, cy) {
  const t = photoTransform();
  if (!t) return null;
  return { x: (cx - t.rect.left - t.dx) / t.scale, y: (cy - t.rect.top - t.dy) / t.scale };
}

function drawPhotoBox(p, manual) {
  const [x, y, w, h] = p.bbox;
  const color = manual ? '#30d158' : '#0a84ff';
  pctx.strokeStyle = color;
  pctx.lineWidth = 3;
  pctx.strokeRect(x, y, w, h);
  const label = zh(p.class) + ' ' + Math.round(p.score * 100) + '%';
  pctx.font = 'bold 14px -apple-system, "PingFang TC", sans-serif';
  const tw = pctx.measureText(label).width + 12;
  const th = 22;
  const ty = y - th;
  pctx.fillStyle = color;
  pctx.fillRect(x, ty > 0 ? ty : y, tw, th);
  pctx.fillStyle = '#fff';
  pctx.fillText(label, x + 6, (ty > 0 ? ty : y) + 15);
}

function redrawPhoto(dragBox) {
  if (!photoCanvas.width) return;
  pctx.clearRect(0, 0, photoCanvas.width, photoCanvas.height);
  pctx.drawImage(frameCanvas, 0, 0);
  for (const p of photoPredictions) drawPhotoBox(p, p.manual);
  if (dragBox) {
    pctx.strokeStyle = '#ffd60a';
    pctx.lineWidth = 2.5;
    pctx.setLineDash([7, 5]);
    pctx.strokeRect(dragBox.x, dragBox.y, dragBox.w, dragBox.h);
    pctx.setLineDash([]);
  }
}

function renderChips(predictions) {
  const counts = new Map();
  for (const p of predictions) {
    const name = zh(p.class);
    const key = name + (p.manual ? ':m' : '');
    const prev = counts.get(key);
    if (!prev || p.score > prev.score) counts.set(key, { name, manual: p.manual, score: p.score, count: (prev ? prev.count + 1 : 1) });
    else counts.set(key, { name, manual: p.manual, score: prev.score, count: prev.count + 1 });
  }
  const items = [...counts.values()].sort((a, b) => b.score - a.score);
  if (items.length === 0) {
    chipsEl.innerHTML = '<span class="chip empty">未偵測到物件</span>';
    return;
  }
  chipsEl.innerHTML = items.map(d =>
    '<span class="chip' + (d.manual ? ' manual' : '') + '">' +
    d.name + (d.count > 1 ? ' ×' + d.count : '') + ' <b>' + Math.round(d.score * 100) + '%</b>' +
    '</span>'
  ).join('');
}

// ---- IoU 去重 + 多尺度偵測 ----
function iou(a, b) {
  const ax = a.bbox[0], ay = a.bbox[1], aw = a.bbox[2], ah = a.bbox[3];
  const bx = b.bbox[0], by = b.bbox[1], bw = b.bbox[2], bh = b.bbox[3];
  const x1 = Math.max(ax, bx), y1 = Math.max(ay, by);
  const x2 = Math.min(ax + aw, bx + bw), y2 = Math.min(ay + ah, by + bh);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  const union = aw * ah + bw * bh - inter;
  return inter / (union || 1);
}
function dedupeByIoU(preds, thresh) {
  const out = [];
  for (const p of preds) {
    let dup = false;
    for (const o of out) {
      if (p.class === o.class && iou(p, o) > thresh) { dup = true; break; }
    }
    if (!dup) out.push(p);
  }
  return out;
}
async function detectMultiScale(img, minScore) {
  const results = [];
  const full = await model.detect(img, undefined, minScore);
  results.push(...full);
  const W = img.width, H = img.height;
  const bw = Math.round(W * 0.6), bh = Math.round(H * 0.6);
  const crops = [[0, 0], [W - bw, 0], [0, H - bh], [W - bw, H - bh]];
  for (const [cx, cy] of crops) {
    const tmp = document.createElement('canvas');
    tmp.width = bw; tmp.height = bh;
    const tctx = tmp.getContext('2d');
    tctx.drawImage(img, cx, cy, bw, bh, 0, 0, bw, bh);
    const preds = await model.detect(tmp, undefined, minScore);
    for (const p of preds) {
      p.bbox[0] += cx; p.bbox[1] += cy;
      results.push(p);
    }
  }
  return dedupeByIoU(results, 0.5);
}

// ---- 實時偵測 loop ----
async function loop() {
  if (!running || frozen) return;
  const now = performance.now();
  if (now - lastFrame > 1000 / 15) {
    lastFrame = now;
    const predictions = await model.detect(video, 50, 0.35);
    if (!running || frozen) return;
    const vw = video.videoWidth, vh = video.videoHeight;
    const scale = Math.max(canvas.width / vw, canvas.height / vh);
    const dx = (canvas.width - vw * scale) / 2;
    const dy = (canvas.height - vh * scale) / 2;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of predictions) {
      const [x, y, w, h] = p.bbox;
      ctx.strokeStyle = '#0a84ff';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(dx + x * scale, dy + y * scale, w * scale, h * scale);
      const label = zh(p.class) + ' ' + Math.round(p.score * 100) + '%';
      ctx.font = 'bold 14px -apple-system, "PingFang TC", sans-serif';
      const tw = ctx.measureText(label).width + 12;
      const ty = dy + y * scale - 22;
      ctx.fillStyle = '#0a84ff';
      ctx.fillRect(dx + x * scale, ty > 0 ? ty : dy + y * scale, tw, 22);
      ctx.fillStyle = '#fff';
      ctx.fillText(label, dx + x * scale + 6, (ty > 0 ? ty : dy + y * scale) + 15);
    }
    renderChips(predictions);
    fpsAccum.push(performance.now());
    fpsAccum = fpsAccum.filter(t => performance.now() - t < 1000);
    fpsEl.hidden = false;
    fpsEl.textContent = fpsAccum.length + ' FPS';
  }
  rafId = requestAnimationFrame(loop);
}

// ---- 影相分析 ----
async function capturePhoto() {
  if (!stream || frozen) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;

  frozen = true;
  cancelAnimationFrame(rafId);

  const sw = stage.clientWidth, sh = stage.clientHeight;
  const coverScale = Math.max(sw / vw, sh / vh);
  const cw = sw / coverScale;
  const ch = sh / coverScale;
  const cx = (vw - cw) / 2;
  const cy = (vh - ch) / 2;

  frameCanvas.width = Math.round(cw);
  frameCanvas.height = Math.round(ch);
  fctx.drawImage(video, cx, cy, cw, ch, 0, 0, frameCanvas.width, frameCanvas.height);

  photoCanvas.width = frameCanvas.width;
  photoCanvas.height = frameCanvas.height;

  video.style.display = 'none';
  canvas.style.display = 'none';
  photoCanvas.hidden = false;
  fpsEl.hidden = true;
  modeTag.hidden = false;
  modeTag.textContent = '📸 相片模式';
  statusEl.textContent = '分析相片中…';
  statusEl.className = 'status';
  captureBtn.textContent = '↩️';
  captureBtn.classList.add('off');
  advancedBtn.disabled = false;
  hint.hidden = true;
  classifyBox.hidden = true;

  photoPredictions = [];
  redrawPhoto();
  const predictions = await detectMultiScale(frameCanvas, 0.3);
  photoPredictions = predictions.map(p => ({ ...p, manual: false }));
  redrawPhoto();
  renderChips(photoPredictions);
  statusEl.textContent = '相片分析完成 ✓ 拖動可框選漏咗嘅物件';
  hint.hidden = false;
}

// ---- 手動框選 ----
let dragStart = null;
let dragCur = null;
let analyzing = false;

photoCanvas.addEventListener('pointerdown', (e) => {
  if (!frozen) return;
  const pt = clientToPhoto(e.clientX, e.clientY);
  if (!pt) return;
  dragStart = pt;
  dragCur = pt;
  photoCanvas.setPointerCapture(e.pointerId);
  e.preventDefault();
});

photoCanvas.addEventListener('pointermove', (e) => {
  if (!frozen || !dragStart) return;
  const pt = clientToPhoto(e.clientX, e.clientY);
  if (!pt) return;
  dragCur = pt;
  redrawPhoto({
    x: Math.min(dragStart.x, pt.x),
    y: Math.min(dragStart.y, pt.y),
    w: Math.abs(pt.x - dragStart.x),
    h: Math.abs(pt.y - dragStart.y)
  });
  e.preventDefault();
});

photoCanvas.addEventListener('pointerup', finishDrag);
photoCanvas.addEventListener('pointercancel', finishDrag);
photoCanvas.addEventListener('lostpointercapture', finishDrag);

async function finishDrag() {
  if (!frozen || !dragStart || analyzing) return;
  const x = Math.min(dragStart.x, dragCur.x);
  const y = Math.min(dragStart.y, dragCur.y);
  const w = Math.abs(dragCur.x - dragStart.x);
  const h = Math.abs(dragCur.y - dragStart.y);
  dragStart = null;
  dragCur = null;

  if (w < 20 || h < 20) { redrawPhoto(); return; }

  analyzing = true;
  statusEl.textContent = '分析框選區域…';
  statusEl.className = 'status';
  try {
    const upscale = Math.max(1, 300 / w);
    const tmp = document.createElement('canvas');
    tmp.width = Math.round(w * upscale);
    tmp.height = Math.round(h * upscale);
    const tctx = tmp.getContext('2d');
    tctx.drawImage(frameCanvas, x, y, w, h, 0, 0, tmp.width, tmp.height);

    const preds = await model.detect(tmp, undefined, 0.3);
    try {
      const m = await loadMobile();
      const cls = await m.classify(tmp, 3);
      showClassify('框選', cls);
    } catch (e) { console.error('框選分類失敗', e); }
    for (const p of preds) {
      p.bbox[0] = p.bbox[0] / upscale + x;
      p.bbox[1] = p.bbox[1] / upscale + y;
      p.bbox[2] = p.bbox[2] / upscale;
      p.bbox[3] = p.bbox[3] / upscale;
      p.manual = true;
    }
    if (preds.length === 0) {
      statusEl.textContent = '框選區域認唔到物件，試下框大啲。';
    } else {
      photoPredictions = photoPredictions.concat(preds);
      statusEl.textContent = '加咗 ' + preds.length + ' 個手動偵測 ✓';
    }
  } catch (err) {
    console.error(err);
    statusEl.textContent = '分析失敗：' + err.message;
    statusEl.className = 'status err';
  }
  analyzing = false;
  redrawPhoto();
  renderChips(photoPredictions);
  hint.hidden = false;
}

// ---- 進階偵測：OWL-ViT ----
async function loadOWL() {
  if (owlDetector) return owlDetector;
  if (owlLoading) return null;
  owlLoading = true;
  statusEl.textContent = '下載進階模型（約 60MB，第一次要等）…';
  statusEl.className = 'status';
  try {
    const T = window['@xenova/transformers'] || window.transformers;
    if (!T) throw new Error('Transformers.js 未載入');
    owlDetector = await T.pipeline('zero-shot-object-detection', 'Xenova/owlvit-base-patch32');
    return owlDetector;
  } catch (err) {
    console.error(err);
    statusEl.textContent = '進階模型下載失敗：' + err.message;
    statusEl.className = 'status err';
    return null;
  } finally {
    owlLoading = false;
  }
}

async function advancedDetect() {
  if (!frozen || !frameCanvas.width) return;
  const det = await loadOWL();
  if (!det) return;
  advancedBtn.disabled = true;
  statusEl.textContent = '進階分析中（可能要 5-15 秒）…';
  statusEl.className = 'status';
  try {
    const output = await det(frameCanvas, HOME_LABELS, { top_k: 3, threshold: 0.1 });
    const preds = output.map(o => ({
      bbox: [o.box.xmin, o.box.ymin, o.box.xmax - o.box.xmin, o.box.ymax - o.box.ymin],
      class: HOME_ZH[o.label] || o.label,
      score: o.score,
      manual: false
    }));
    photoPredictions = preds;
    if (preds.length === 0) {
      statusEl.textContent = '進階偵測認唔到物件，試下標準模式或手動框選。';
    } else {
      statusEl.textContent = '進階偵測完成 ✓ 認到 ' + preds.length + ' 樣物件';
    }
  } catch (err) {
    console.error(err);
    statusEl.textContent = '進階分析失敗：' + err.message;
    statusEl.className = 'status err';
  }
  redrawPhoto();
  renderChips(photoPredictions);
  advancedBtn.disabled = false;
}

function resumeLive() {
  frozen = false;
  photoPredictions = [];
  photoCanvas.hidden = true;
  pctx.clearRect(0, 0, photoCanvas.width, photoCanvas.height);
  video.style.display = '';
  canvas.style.display = '';
  modeTag.hidden = true;
  hint.hidden = true;
  classifyBox.hidden = true;
  captureBtn.textContent = '📷';
  captureBtn.classList.remove('off');
  advancedBtn.disabled = true;
  statusEl.textContent = '偵測中…';
  statusEl.className = 'status';
  lastFrame = 0;
  loop();
}

async function start() {
  try {
    if (!model) await loadModel();
    loadMobile();
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    setSize();
    placeholder.style.display = 'none';
    running = true;
    frozen = false;
    toggleBtn.textContent = '✕';
    captureBtn.disabled = false;
    statusEl.textContent = '偵測中…';
    statusEl.className = 'status';
    loop();
  } catch (err) {
    console.error(err);
    running = false;
    statusEl.textContent = err.name === 'NotAllowedError'
      ? '鏡頭權限被拒絕，請喺瀏覽器允許鏡頭存取。'
      : '無法開啟鏡頭：' + err.message;
    statusEl.className = 'status err';
    toggleBtn.textContent = '▶️';
  }
}

function stop() {
  running = false;
  frozen = false;
  photoPredictions = [];
  cancelAnimationFrame(rafId);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  photoCanvas.hidden = true;
  pctx.clearRect(0, 0, photoCanvas.width, photoCanvas.height);
  video.style.display = '';
  canvas.style.display = '';
  modeTag.hidden = true;
  hint.hidden = true;
  classifyBox.hidden = true;
  placeholder.style.display = '';
  chipsEl.innerHTML = '';
  fpsEl.hidden = true;
  toggleBtn.textContent = '▶️';
  captureBtn.textContent = '📷';
  captureBtn.classList.remove('off');
  captureBtn.disabled = true;
  advancedBtn.disabled = true;
  statusEl.textContent = '';
  statusEl.className = 'status';
}

toggleBtn.addEventListener('click', () => { running ? stop() : start(); });
captureBtn.addEventListener('click', () => { frozen ? resumeLive() : capturePhoto(); });
advancedBtn.addEventListener('click', advancedDetect);
window.addEventListener('resize', setSize);

loadModel();
</script>
